# Project-wide Gradle settings for MinimalFlow Launcher.
#
# Keeping the JVM heap small matters here: the project is expected to build on
# modest hardware (and on GitHub Actions runners). If Gradle reports an
# OutOfMemoryError, raise `org.gradle.jvmargs` rather than disabling any check.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Only the resources of the Android Gradle Plugin are needed; the project does
# not depend on Jetifier.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true

kotlin.code.style=official
ksp.incremental=true
